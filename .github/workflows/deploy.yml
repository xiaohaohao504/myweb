name: Deploy to GitHub Pages

# Triggers automatically on every push to main, plus manual runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments so only one runs at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site (Nuxt)
        env:
          # Project site served at https://<user>.github.io/myweb/, so assets must be prefixed.
          NUXT_APP_BASE_URL: /myweb/
          NITRO_PRESET: static
        run: npm run generate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
